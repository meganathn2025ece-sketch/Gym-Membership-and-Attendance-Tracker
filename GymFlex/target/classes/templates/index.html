<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GymFlex</title><link rel="stylesheet" href="/css/style.css"></head><body><header><div><h1>GymFlex</h1><p>Gym Membership and Attendance Tracker</p></div><a href="/members/new" class="btn">+ Register Member</a></header><main><div class="cards"><div><span>Total Members</span><b th:text="${memberCount}">0</b></div><div><span>Total Check-ins</span><b th:text="${checkInCount}">0</b></div><div><span>Expiring in 7 Days</span><b th:text="${#lists.size(expiring)}">0</b></div></div><div class="panel" th:if="${error}"><strong th:text="${error}"></strong></div><section class="panel"><h2>Members</h2><table><tr><th>ID</th><th>Name</th><th>Phone</th><th>Plan</th><th>End Date</th><th>This Month</th><th>Actions</th></tr><tr th:each="m:${members}"><td th:text="${m.id}"></td><td th:text="${m.name}"></td><td th:text="${m.phone}"></td><td th:text="${m.plan.name}"></td><td th:text="${@gymService.membership(m.id).endDate}"></td><td th:text="${@gymService.attendance(m.id)}"></td><td><form th:action="@{'/members/'+${m.id}+'/checkin'}" method="post" style="display:inline"><button>Check-in</button></form><form th:action="@{'/members/'+${m.id}+'/renew'}" method="post" style="display:inline"><select name="planId"><option th:each="p:${@gymService.plans()}" th:value="${p.id}" th:text="${p.name}"></option></select><button>Renew</button></form></td></tr><tr th:if="${#lists.isEmpty(members)}"><td colspan="7">No members registered.</td></tr></table></section><section class="panel"><h2>Expiring in the next 7 days</h2><p th:if="${#lists.isEmpty(expiring)}">No memberships are expiring soon.</p><ul><li th:each="x:${expiring}" th:text="${x.member.name+' - '+x.endDate}"></li></ul></section></main></body></html>
