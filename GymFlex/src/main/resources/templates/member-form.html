<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - GymFlex</title><link rel="stylesheet" href="/css/style.css"></head><body><header><div><h1>GymFlex</h1><p>Register New Member</p></div><a href="/" class="btn secondary">Dashboard</a></header><main><section class="panel formbox"><h2>Member Registration</h2><div class="error" th:if="${error}" th:text="${error}"></div><form th:action="@{/members}" th:object="${member}" method="post"><label>Name<input th:field="*{name}" required></label><label>Phone<input th:field="*{phone}" required></label><label>Email<input type="email" th:field="*{email}"></label><label>Address<input th:field="*{address}" required></label><label>Plan<select name="planId" required><option value="">Select plan</option><option th:each="p:${plans}" th:value="${p.id}" th:text="${p.name+' - ₹'+p.price}"></option></select></label><button class="btn" type="submit">Register Member</button></form></section></main></body></html>
